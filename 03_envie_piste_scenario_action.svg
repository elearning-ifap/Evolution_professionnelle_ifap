<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">De l’envie à la première action</title>
<desc id="desc">Quatre étapes transforment une envie en action : mon envie, une piste, un scénario, puis une première action.</desc>
<rect width="100%" height="100%" rx="28" fill="#F7F7F5"/>

<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6F6F6F"/></marker>
</defs>
<text x="550" y="55" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="24" font-weight="900" fill="#2D2D2D">Un projet se précise progressivement</text>
<g stroke="#6F6F6F" stroke-width="4" marker-end="url(#arr)" fill="none">
 <line x1="255" y1="220" x2="315" y2="220"/><line x1="515" y1="220" x2="575" y2="220"/><line x1="790" y1="220" x2="850" y2="220"/>
</g>
<g font-family="Lato,Arial,sans-serif">
 <rect x="35" y="105" width="220" height="230" rx="24" fill="#FEFEFE" stroke="#2FB6BC" stroke-width="4"/>
 <circle cx="75" cy="145" r="23" fill="#2FB6BC"/><text x="75" y="153" text-anchor="middle" font-size="21" font-weight="900" fill="white">1</text>
 <text x="110" y="148" font-size="21" font-weight="900" fill="#2D2D2D">Mon envie</text>
 <text x="65" y="203" font-size="17" font-weight="800" fill="#6F6F6F">« Davantage de</text>
 <text x="65" y="229" font-size="17" font-weight="800" fill="#6F6F6F">responsabilités »</text>
 <text x="65" y="286" font-size="13" font-weight="700" fill="#2FB6BC">Je pars de ce que je recherche.</text>

 <rect x="315" y="105" width="200" height="230" rx="24" fill="#FEFEFE" stroke="#F2B445" stroke-width="4"/>
 <circle cx="355" cy="145" r="23" fill="#F2B445"/><text x="355" y="153" text-anchor="middle" font-size="21" font-weight="900" fill="white">2</text>
 <text x="390" y="148" font-size="21" font-weight="900" fill="#2D2D2D">Une piste</text>
 <text x="345" y="213" font-size="18" font-weight="900" fill="#2D2D2D">« Passer un</text>
 <text x="345" y="241" font-size="18" font-weight="900" fill="#2D2D2D">concours »</text>
 <text x="345" y="286" font-size="13" font-weight="700" fill="#6F6F6F">Une voie possible,</text>
 <text x="345" y="306" font-size="13" font-weight="700" fill="#6F6F6F">pas encore un projet.</text>

 <rect x="575" y="85" width="215" height="270" rx="24" fill="#FEFEFE" stroke="#7C6EAF" stroke-width="4"/>
 <circle cx="615" cy="125" r="23" fill="#7C6EAF"/><text x="615" y="133" text-anchor="middle" font-size="21" font-weight="900" fill="white">3</text>
 <text x="650" y="128" font-size="21" font-weight="900" fill="#2D2D2D">Un scénario</text>
 <text x="605" y="180" font-size="14" font-weight="800" fill="#6F6F6F">Identifier les fonctions visées,</text>
 <text x="605" y="204" font-size="14" font-weight="800" fill="#6F6F6F">vérifier les voies d’accès,</text>
 <text x="605" y="228" font-size="14" font-weight="800" fill="#6F6F6F">mesurer ce qui me manque</text>
 <text x="605" y="252" font-size="14" font-weight="800" fill="#6F6F6F">et ce dont je dois tenir compte.</text>
 <text x="605" y="309" font-size="13" font-weight="700" fill="#7C6EAF">L’objectif et la voie sont reliés.</text>

 <rect x="850" y="105" width="215" height="230" rx="24" fill="#FEFEFE" stroke="#ED9C89" stroke-width="4"/>
 <circle cx="890" cy="145" r="23" fill="#ED9C89"/><text x="890" y="153" text-anchor="middle" font-size="21" font-weight="900" fill="white">4</text>
 <text x="925" y="142" font-size="19" font-weight="900" fill="#2D2D2D">Ma première</text>
 <text x="925" y="166" font-size="19" font-weight="900" fill="#2D2D2D">action</text>
 <text x="880" y="222" font-size="15" font-weight="800" fill="#6F6F6F">« Regarder les postes</text>
 <text x="880" y="247" font-size="15" font-weight="800" fill="#6F6F6F">et fonctions concernés »</text>
 <text x="880" y="302" font-size="13" font-weight="700" fill="#ED9C89">Je peux agir sans avoir tout décidé.</text>
</g>

</svg>