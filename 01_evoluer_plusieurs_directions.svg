<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Évoluer n'a pas une seule direction</title>
<desc id="desc">Six formes d’évolution professionnelle entourent le mot évoluer : apprendre, progresser, bouger, faire reconnaître son expérience, faire évoluer ses missions et se reconvertir.</desc>
<rect width="100%" height="100%" rx="28" fill="#F7F7F5"/>

<defs>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D2D2D" flood-opacity=".10"/></filter>
</defs>
<circle cx="500" cy="250" r="103" fill="#FEFEFE" stroke="#2FB6BC" stroke-width="8" filter="url(#s)"/>
<text x="500" y="238" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="34" font-weight="900" fill="#2D2D2D">ÉVOLUER</text>
<text x="500" y="275" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="18" font-weight="700" fill="#6F6F6F">n’a pas une seule direction</text>

<g stroke="#E6E6E1" stroke-width="5" stroke-linecap="round">
  <line x1="430" y1="185" x2="286" y2="110"/><line x1="570" y1="185" x2="714" y2="110"/>
  <line x1="397" y1="250" x2="250" y2="250"/><line x1="603" y1="250" x2="750" y2="250"/>
  <line x1="430" y1="315" x2="286" y2="390"/><line x1="570" y1="315" x2="714" y2="390"/>
</g>

<g font-family="Lato,Arial,sans-serif">
  <rect x="70" y="55" width="250" height="105" rx="20" fill="#FEFEFE" stroke="#2FB6BC" stroke-width="3"/>
  <circle cx="105" cy="91" r="17" fill="#2FB6BC"/><path d="M97 92h16M105 84v16" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <text x="136" y="92" font-size="22" font-weight="900" fill="#2D2D2D">Apprendre</text>
  <text x="105" y="128" font-size="15" font-weight="700" fill="#6F6F6F">Développer mes compétences</text>

  <rect x="680" y="55" width="250" height="105" rx="20" fill="#FEFEFE" stroke="#F2B445" stroke-width="3"/>
  <circle cx="715" cy="91" r="17" fill="#F2B445"/><path d="M707 96l8-11 8 11" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="92" font-size="22" font-weight="900" fill="#2D2D2D">Progresser</text>
  <text x="715" y="128" font-size="15" font-weight="700" fill="#6F6F6F">Accéder à d’autres responsabilités</text>

  <rect x="35" y="198" width="260" height="105" rx="20" fill="#FEFEFE" stroke="#50B4DC" stroke-width="3"/>
  <circle cx="70" cy="234" r="17" fill="#50B4DC"/><path d="M62 234h16m-5-6 6 6-6 6" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="101" y="235" font-size="22" font-weight="900" fill="#2D2D2D">Bouger</text>
  <text x="70" y="271" font-size="15" font-weight="700" fill="#6F6F6F">Poste, service, employeur, lieu</text>

  <rect x="705" y="198" width="260" height="105" rx="20" fill="#FEFEFE" stroke="#7C6EAF" stroke-width="3"/>
  <circle cx="740" cy="234" r="17" fill="#7C6EAF"/><path d="M731 241v-15h18v15m-14-10h10" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  <text x="771" y="226" font-size="19" font-weight="900" fill="#2D2D2D">Faire reconnaître</text>
  <text x="771" y="250" font-size="19" font-weight="900" fill="#2D2D2D">mon expérience</text>
  <text x="740" y="278" font-size="15" font-weight="700" fill="#6F6F6F">VAE, certification, acquis</text>

  <rect x="70" y="340" width="250" height="105" rx="20" fill="#FEFEFE" stroke="#ED9C89" stroke-width="3"/>
  <circle cx="105" cy="376" r="17" fill="#ED9C89"/><path d="M96 381c10-15 16-15 22 0" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="377" font-size="20" font-weight="900" fill="#2D2D2D">Faire évoluer</text>
  <text x="136" y="401" font-size="20" font-weight="900" fill="#2D2D2D">mes missions</text>

  <rect x="680" y="340" width="250" height="105" rx="20" fill="#FEFEFE" stroke="#2FB6BC" stroke-width="3"/>
  <circle cx="715" cy="376" r="17" fill="#2FB6BC"/><path d="M707 384l16-16m-16 0h16v16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="377" font-size="21" font-weight="900" fill="#2D2D2D">Me reconvertir</text>
  <text x="715" y="413" font-size="15" font-weight="700" fill="#6F6F6F">Préparer une transition</text>
</g>

</svg>