<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Donner du sens à son parcours</title>
<desc id="desc">Illustration pédagogique pour un module de préparation à l'entretien professionnel.</desc>
<rect width="1200" height="520" fill="#FFFFFF"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#39735A"/>
</marker>
</defs><text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#28533F">Donner du sens à son parcours</text><text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#667174">L'entretien ne demande pas de tout raconter : il faut rendre son parcours lisible.</text><rect x="70" y="155" width="260" height="82" rx="16" fill="#EDF4F6" stroke="#C7D8DE" stroke-width="2"/><text x="200" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#456572">Expérience 1</text><text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que j'ai vécu</text><line x1="200" y1="237" x2="200" y2="265" stroke="#456572" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="265" width="260" height="82" rx="16" fill="#EDF4F6" stroke="#C7D8DE" stroke-width="2"/><text x="200" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#456572">Expérience 2</text><text x="200" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que j'ai appris</text><line x1="200" y1="347" x2="200" y2="375" stroke="#456572" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="375" width="260" height="82" rx="16" fill="#EDF4F6" stroke="#C7D8DE" stroke-width="2"/><text x="200" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#456572">Expérience 3</text><text x="200" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que j'ai assumé</text><rect x="440" y="190" width="260" height="200" rx="28" fill="#EAF4EE" stroke="#BFD8C8" stroke-width="2"/><circle cx="570" cy="242" r="36" fill="#39735A" stroke="none" stroke-width="0"/><text x="570" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">?</text><text x="570" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#28533F">Quel sens</text><text x="570" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#303638">donner à ce parcours ?</text><line x1="340" y1="285" x2="430" y2="285" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="710" y1="285" x2="800" y2="285" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="820" y="125" width="310" height="70" rx="16" fill="#EAF4EE" stroke="#C9DED0" stroke-width="2"/><text x="845" y="154" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#28533F">Compétences</text><text x="845" y="179" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#667174">Ce que je sais faire</text><rect x="820" y="215" width="310" height="70" rx="16" fill="#EAF4EE" stroke="#C9DED0" stroke-width="2"/><text x="845" y="244" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#28533F">Progression</text><text x="845" y="269" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#667174">Ce qui a évolué</text><rect x="820" y="305" width="310" height="70" rx="16" fill="#EAF4EE" stroke="#C9DED0" stroke-width="2"/><text x="845" y="334" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#28533F">Projet</text><text x="845" y="359" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#667174">Ce que je vise</text><rect x="820" y="395" width="310" height="70" rx="16" fill="#EAF4EE" stroke="#C9DED0" stroke-width="2"/><text x="845" y="424" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#28533F">Motivations</text><text x="845" y="449" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#667174">Pourquoi cela a du sens</text></svg>