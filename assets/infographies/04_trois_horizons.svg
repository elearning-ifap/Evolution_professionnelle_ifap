<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Les trois horizons du projet d’évolution</title>
<desc id="desc">Une ligne du temps distingue trois horizons : maintenant, les prochains mois et plus tard. Le message final rappelle qu’il n’est pas nécessaire de tout faire immédiatement.</desc>
<rect width="100%" height="100%" rx="28" fill="#F7F7F5"/>

<text x="550" y="52" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="25" font-weight="900" fill="#2D2D2D">Une évolution se construit par étapes</text>
<line x1="160" y1="150" x2="940" y2="150" stroke="#E6E6E1" stroke-width="12" stroke-linecap="round"/>
<line x1="160" y1="150" x2="550" y2="150" stroke="#2FB6BC" stroke-width="12" stroke-linecap="round"/>
<circle cx="180" cy="150" r="28" fill="#2FB6BC"/>
<circle cx="550" cy="150" r="28" fill="#F2B445"/>
<circle cx="920" cy="150" r="28" fill="#7C6EAF"/>
<g font-family="Lato,Arial,sans-serif">
 <text x="180" y="158" text-anchor="middle" font-size="22" font-weight="900" fill="white">1</text>
 <text x="550" y="158" text-anchor="middle" font-size="22" font-weight="900" fill="white">2</text>
 <text x="920" y="158" text-anchor="middle" font-size="22" font-weight="900" fill="white">3</text>

 <text x="180" y="215" text-anchor="middle" font-size="23" font-weight="900" fill="#2D2D2D">Maintenant</text>
 <text x="180" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">m’informer · vérifier</text>
 <text x="180" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">prendre un premier contact</text>

 <text x="550" y="215" text-anchor="middle" font-size="23" font-weight="900" fill="#2D2D2D">Prochains mois</text>
 <text x="550" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">me former · enquêter</text>
 <text x="550" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">préparer une candidature</text>

 <text x="920" y="215" text-anchor="middle" font-size="23" font-weight="900" fill="#2D2D2D">Plus tard</text>
 <text x="920" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">changer de métier · mobilité</text>
 <text x="920" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#6F6F6F">concours · projet plus important</text>
</g>
<text x="550" y="326" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="16" font-weight="800" fill="#6F6F6F">Je n’ai pas besoin de tout faire maintenant pour commencer à avancer.</text>

</svg>