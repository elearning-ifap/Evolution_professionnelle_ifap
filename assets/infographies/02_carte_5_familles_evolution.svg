 <rect x="45" y="68" width="300" height="155" rx="22" fill="#FEFEFE" stroke="#2FB6BC" stroke-width="4"/>
 <circle cx="85" cy="108" r="23" fill="#2FB6BC"/><text x="85" y="116" text-anchor="middle" font-size="22" font-weight="900" fill="white">1</text>
 <text x="122" y="106" font-size="21" font-weight="900" fill="#2D2D2D">Faire évoluer ce que je fais</text>
 <text x="85" y="146" font-size="15" font-weight="700" fill="#6F6F6F">compétences · missions</text>
 <text x="85" y="171" font-size="15" font-weight="700" fill="#6F6F6F">expertise · responsabilités</text>

 <rect x="755" y="68" width="300" height="155" rx="22" fill="#FEFEFE" stroke="#50B4DC" stroke-width="4"/>
 <circle cx="795" cy="108" r="23" fill="#50B4DC"/><text x="795" y="116" text-anchor="middle" font-size="22" font-weight="900" fill="white">2</text>
 <text x="832" y="106" font-size="24" font-weight="900" fill="#2D2D2D">Bouger</text>
 <text x="795" y="146" font-size="15" font-weight="700" fill="#6F6F6F">poste · service · employeur</text>
 <text x="795" y="171" font-size="15" font-weight="700" fill="#6F6F6F">lieu · métier</text>

 <rect x="790" y="245" width="290" height="145" rx="22" fill="#FEFEFE" stroke="#F2B445" stroke-width="4"/>
 <circle cx="828" cy="285" r="23" fill="#F2B445"/><text x="828" y="293" text-anchor="middle" font-size="22" font-weight="900" fill="white">3</text>
 <text x="865" y="278" font-size="20" font-weight="900" fill="#2D2D2D">Progresser</text>
 <text x="865" y="303" font-size="20" font-weight="900" fill="#2D2D2D">ou accéder</text>
 <text x="828" y="342" font-size="14" font-weight="700" fill="#6F6F6F">avancement · concours · examen</text>

 <rect x="755" y="425" width="300" height="145" rx="22" fill="#FEFEFE" stroke="#7C6EAF" stroke-width="4"/>
 <circle cx="795" cy="465" r="23" fill="#7C6EAF"/><text x="795" y="473" text-anchor="middle" font-size="22" font-weight="900" fill="white">4</text>
 <text x="832" y="458" font-size="20" font-weight="900" fill="#2D2D2D">Faire reconnaître</text>
 <text x="832" y="484" font-size="20" font-weight="900" fill="#2D2D2D">mes acquis</text>
 <text x="795" y="525" font-size="14" font-weight="700" fill="#6F6F6F">formation · certification · VAE</text>

 <rect x="45" y="425" width="300" height="145" rx="22" fill="#FEFEFE" stroke="#ED9C89" stroke-width="4"/>
