<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">Les cinq familles d’évolution professionnelle</title>
<desc id="desc">Une carte place le projet d’évolution au centre et cinq familles autour : faire évoluer ce que je fais, bouger, progresser ou accéder, faire reconnaître mes acquis et préparer une transition.</desc>
<rect width="100%" height="100%" rx="28" fill="#F7F7F5"/>

<defs>
 <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D2D2D" flood-opacity=".10"/></filter>
</defs>
<circle cx="550" cy="310" r="112" fill="#FEFEFE" stroke="#2D2D2D" stroke-width="3" filter="url(#s2)"/>
<text x="550" y="282" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="21" font-weight="800" fill="#6F6F6F">MON PROJET</text>
<text x="550" y="316" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="31" font-weight="900" fill="#2D2D2D">D’ÉVOLUTION</text>
<text x="550" y="350" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="16" font-weight="700" fill="#6F6F6F">plusieurs chemins possibles</text>

<g fill="none" stroke-width="7" stroke-linecap="round">
