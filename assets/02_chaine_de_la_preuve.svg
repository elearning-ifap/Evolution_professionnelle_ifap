<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">La chaîne de la preuve</title>
<desc id="desc">Illustration pédagogique pour un module de préparation à l'entretien professionnel.</desc>
<rect width="1400" height="420" fill="#FFFFFF"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#39735A"/>
</marker>
</defs><text x="700" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#28533F">Transformer une expérience en preuve</text><text x="700" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#667174">Une compétence devient crédible quand elle s'appuie sur des faits précis.</text><rect x="55" y="145" width="235" height="175" rx="20" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><circle cx="89" cy="180" r="22" fill="#39735A" stroke="none" stroke-width="0"/><text x="89" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text><text x="172.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Situation</text><text x="172.5" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Quel était l'enjeu ?</text><line x1="297" y1="233" x2="316" y2="233" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="324" y="145" width="235" height="175" rx="20" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><circle cx="358" cy="180" r="22" fill="#39735A" stroke="none" stroke-width="0"/><text x="358" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text><text x="441.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Action</text><text x="441.5" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Qu'ai-je fait ?</text><line x1="566" y1="233" x2="585" y2="233" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="593" y="145" width="235" height="175" rx="20" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><circle cx="627" cy="180" r="22" fill="#39735A" stroke="none" stroke-width="0"/><text x="627" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text><text x="710.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Résultat</text><text x="710.5" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Qu'est-ce qui a changé</text><text x="710.5" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">?</text><line x1="835" y1="233" x2="854" y2="233" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="862" y="145" width="235" height="175" rx="20" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><circle cx="896" cy="180" r="22" fill="#39735A" stroke="none" stroke-width="0"/><text x="896" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text><text x="979.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Compétence</text><text x="979.5" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Que cela démontre-t-il</text><text x="979.5" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">?</text><line x1="1104" y1="233" x2="1123" y2="233" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1131" y="145" width="235" height="175" rx="20" fill="#FFF7D7" stroke="#E7CF78" stroke-width="2"/><circle cx="1165" cy="180" r="22" fill="#F2C84B" stroke="none" stroke-width="0"/><text x="1165" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#303638">5</text><text x="1248.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Recul</text><text x="1248.5" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Qu'en ai-je appris ?</text><text x="700" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#456572">Réflexe : « Qu'ai-je fait qui permet de le démontrer ? »</text></svg>