<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="480" viewBox="0 0 1300 480" role="img" aria-labelledby="title desc">
<title id="title">Adapter son argumentaire à l'entretien</title>
<desc id="desc">Illustration pédagogique pour un module de préparation à l'entretien professionnel.</desc>
<rect width="1300" height="480" fill="#FFFFFF"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#39735A"/>
</marker>
</defs><text x="650" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#28533F">Adapter son argumentaire à l'entretien</text><text x="650" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#667174">Le fond reste le vôtre ; la sélection change selon ce que l'entretien cherche à apprécier.</text><rect x="70" y="150" width="300" height="220" rx="22" fill="#EDF4F6" stroke="#C5D6DD" stroke-width="2"/><text x="220" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#456572">MON PARCOURS</text><rect x="110" y="225" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="220" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Expériences</text><rect x="110" y="259" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="220" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Compétences</text><rect x="110" y="293" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="220" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Projet</text><rect x="110" y="327" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="220" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Motivations</text><line x1="390" y1="260" x2="490" y2="260" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="510" y="175" width="280" height="170" rx="24" fill="#FFF7D7" stroke="#E8D17B" stroke-width="2"/><text x="650" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#667174">FILTRE</text><text x="650" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#303638">Attentes</text><text x="650" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#667174">+ durée</text><text x="650" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#667174">+ support</text><line x1="810" y1="260" x2="910" y2="260" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="930" y="150" width="300" height="220" rx="22" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><text x="1080" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">MON ARGUMENTAIRE</text><rect x="970" y="225" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="1080" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Je sélectionne</text><rect x="970" y="259" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="1080" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">J'illustre</text><rect x="970" y="293" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="1080" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Je relie</text><rect x="970" y="327" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#E4E8E7" stroke-width="1"/><text x="1080" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303638">Je me projette</text><text x="650" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#456572">Même parcours. Une présentation adaptée à la situation.</text></svg>