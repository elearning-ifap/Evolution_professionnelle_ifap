<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">Construire un projet professionnel cohérent</title>
<desc id="desc">Illustration pédagogique pour un module de préparation à l'entretien professionnel.</desc>
<rect width="1400" height="470" fill="#FFFFFF"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#39735A"/>
</marker>
</defs><text x="700" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#28533F">Construire un projet professionnel cohérent</text><text x="700" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#667174">Le projet gagne en crédibilité lorsqu'il prolonge ce que le parcours a réellement construit.</text><rect x="45" y="160" width="235" height="160" rx="22" fill="#EDF4F6" stroke="#C6D8DE" stroke-width="2"/><text x="162.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#456572">Mes expériences</text><text x="162.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que j'ai vécu</text><line x1="288" y1="240" x2="307" y2="240" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="315" y="160" width="235" height="160" rx="22" fill="#EDF4F6" stroke="#C6D8DE" stroke-width="2"/><text x="432.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#456572">Mes compétences</text><text x="432.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que je sais faire</text><line x1="558" y1="240" x2="577" y2="240" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="585" y="160" width="235" height="160" rx="22" fill="#EDF4F6" stroke="#C6D8DE" stroke-width="2"/><text x="702.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#456572">Mon identité pro</text><text x="702.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Qui je suis</text><text x="702.5" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">aujourd'hui</text><line x1="828" y1="240" x2="847" y2="240" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="855" y="160" width="235" height="160" rx="22" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><text x="972.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Mon projet</text><text x="972.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que je souhaite</text><text x="972.5" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">développer</text><line x1="1098" y1="240" x2="1117" y2="240" stroke="#39735A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1125" y="160" width="235" height="160" rx="22" fill="#EAF4EE" stroke="#BED7C7" stroke-width="2"/><text x="1242.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28533F">Ma contribution</text><text x="1242.5" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">Ce que je veux</text><text x="1242.5" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#667174">apporter</text><rect x="345" y="355" width="710" height="62" rx="18" fill="#FFF7D7" stroke="#ECD583" stroke-width="2"/><text x="700" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#303638">Question clé : « Pourquoi cette évolution a-t-elle du sens maintenant ? »</text></svg>